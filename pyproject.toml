[project]
name = "tingposten"
version = "0.1.0"
description = "Hva Bergen kommune faktisk vedtar – hver sak i samme format, med kilde."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "pymupdf>=2.0",
    "pypdf>=6.21.4",
    "requests>=2.31",
    "segno>=1.6.6",
]

[project.scripts]
tingposten = "tingposten.cli:main"

[project.optional-dependencies]
utgave = [
    "brotli>=1.2.1",
    "fonttools>=4.68.0",
    "playwright>=1.64.1",
]
debatt = [
    "anthropic>=2.3.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
